service: next_anime
image: mtremauville/next_anime

servers:
  web:
    - 2.25.22.96

proxy:
  ssl: false
  host: nextanime.tremic.fr
  forward_headers: true
  # Behind the host nginx shared with the Ghost blog: kamal-proxy must not take ports 80/443.
  run:
    http_port: 8080
    https_port: 8443
    bind_ips:
      - 127.0.0.1

registry:
  server: ghcr.io
  username: mtremauville
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - NEXT_ANIME_DATABASE_PASSWORD
    - SMTP_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: next_anime-db
    SMTP_USERNAME: no-reply@tremic.fr

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:17
    host: 2.25.22.96
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: next_anime
        POSTGRES_DB: next_anime_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
