service: next_anime
image: mtremauville/next_anime

servers:
  web:
    - 147.79.114.207

proxy:
  ssl: true
  host: nextanime.tremic.fr

registry:
  server: ghcr.io
  username: mtremauville
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - NEXT_ANIME_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: next_anime-db

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:17
    host: 147.79.114.207
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: next_anime
        POSTGRES_DB: next_anime_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
