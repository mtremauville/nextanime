production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Refreshes the airing and upcoming anime every six hours (minute 5 avoids the busy top of the hour).
  sync_airing_anime:
    class: SyncAiringAnimeJob
    queue: default
    schedule: "5 */6 * * *"

  # Refreshes where the anime can be watched, once a week on Tuesday at night (UTC), at a quiet minute.
  sync_streaming_availabilities:
    class: SyncStreamingAvailabilitiesJob
    queue: default
    schedule: "17 3 * * 2"
